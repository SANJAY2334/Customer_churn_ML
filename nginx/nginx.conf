# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY & TLS TERMINATION CONFIGURATION
# ==============================================================================
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Real IP configuration for upstream load balancers & CDN proxies
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting zone: 10 requests per second with 10MB state storage
    limit_req_zone $binary_remote_addr zone=churn_api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream application services
    upstream flask_backend {
        server flask_api:5000;
        keepalive 32;
    }

    upstream streamlit_backend {
        server streamlit_dashboard:8501;
        keepalive 32;
    }

    # HTTP to HTTPS redirection
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS production server
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.telecom-churn.internal localhost _;

        # TLS Certificate Configuration
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Hardened Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 16M;

        # REST API endpoints & Swagger documentation
        location / {
            limit_req zone=churn_api_limit burst=20 nodelay;
            proxy_pass http://flask_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }

        # Streamlit Analytics Dashboard
        location /dashboard/ {
            proxy_pass http://streamlit_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }
    }
}
